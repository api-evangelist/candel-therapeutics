aid: candel-therapeutics
name: Candel Therapeutics
description: 'Candel Therapeutics, Inc. (Nasdaq: CADL) is a clinical-stage biopharmaceutical
  company headquartered in Needham, Massachusetts, developing off-the-shelf multimodal
  viral immunotherapies for solid tumors. Founded as Advantagene, the company advances
  two engineered viral platforms: aglatimagene besadenovec (CAN-2409), a replication-defective
  adenovirus delivered intratumorally alongside a prodrug to trigger immunogenic cell
  death, and linoserpaturev (CAN-3110), a replication-competent oncolytic herpes simplex
  virus. Its clinical programs span prostate cancer, non-small cell lung cancer, pancreatic
  cancer and recurrent high-grade glioma. Candel is a therapeutics developer, not a
  software vendor: it operates no developer program, publishes no public API, SDK or
  machine-readable specification, and its only credentialed surface is a clinical-trial
  investigator portal.'
